<!-- Consent and analytics. Replaces the old Usercentrics block. Webflow > Site settings > Custom code > Head,
     after the theme snippet. src/global/consent.js runs the banner; this part has to run before anything else.

     Google Consent Mode v2: everything denied by default. Google Analytics and Microsoft Clarity are only
     loaded once the visitor has said yes (stored in the ps_consent cookie), so nothing from Google or
     Microsoft loads before a choice. window.psAnalytics.load() is what the banner calls on Accept. -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied', functionality_storage: 'denied', personalization_storage: 'denied', security_storage: 'granted' });
gtag('set', 'ads_data_redaction', true);
(function () {
  var GA = 'G-ELKBMW227J', CLARITY = 'tcmlnzg8yf', loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    gtag('consent', 'update', { analytics_storage: 'granted' });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA;
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', GA);
    (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script",CLARITY);
    window.clarity('consentv2', { ad_Storage: 'denied', analytics_Storage: 'granted' });
  }
  window.psAnalytics = { load: load, loaded: function () { return loaded; } };
  // ps_consent = <version>.<analytics 1|0>.<consent id>.<unix seconds>. VERSION must match src/global/consent.js;
  // a new version means the banner asks again, so an old yes no longer counts.
  var VERSION = 'v1', m = document.cookie.match(/(?:^|; )ps_consent=([^;]+)/), p = m ? m[1].split('.') : [];
  if (p[0] === VERSION && p[1] === '1') load();
})();
</script>
