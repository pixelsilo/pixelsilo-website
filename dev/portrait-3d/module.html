<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portrait-3d module test</title>
<style>
  body { margin:0; background:#0b0b0c; color:#8a8a8e; font:14px system-ui; }
  .spacer { height:110vh; }
  .row { display:grid; grid-template-columns:repeat(4, 1fr); padding:0 2rem; }
  /* as on the homepage: cols 1-2, 45rem tall, cover at 50% 10% */
  .media { grid-column:1 / span 2; height:45rem; overflow:hidden; position:relative; }
  .media img { width:100%; height:100%; object-fit:cover; object-position:50% 10%; display:block; }
  @media (max-width: 991px) { .media { height:32rem; } }
  @media (max-width: 767px) { .media { height:24rem; grid-column:1 / -1; } }
</style>
</head>
<body>
<div class="spacer"></div>
<section class="row">
  <div class="media" data-module="portrait-3d"><img src="src/luke-portrait.webp" alt="Luke Willson walking across a foggy field"></div>
</section>
<div class="spacer"></div>
<!-- the module finds its layers next to site.js -->
<script src="../../dist/site.js"></script>
<script>window.Webflow.forEach((fn) => fn());</script>
</body>
</html>
